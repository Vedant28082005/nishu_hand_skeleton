<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1760" viewBox="0 0 900 1760"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8a8a"/></marker><marker id="ar-q" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b4b4b4"/></marker></defs><rect width="900" height="1760" fill="#ffffff"/><text x="48" y="48" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="21" text-anchor="start" fill="#1a1a1a" font-weight="bold">signtalk — per-frame control flow</text><text x="48" y="72" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.5" text-anchor="start" fill="#6b6b6b" font-weight="normal">Every rejection path returns to capture without emitting a word</text><rect x="240" y="104" width="180" height="48" rx="24" fill="none" stroke="#8a8a8a" stroke-width="1.5"/><text x="330" y="133" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="bold">START</text><path d="M330 152V184" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/><rect x="180" y="175" width="300" height="74" rx="8" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.5"/><text x="330" y="208" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="normal">Capture frame</text><text x="330" y="229" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" fill="#6b6b6b" font-weight="normal">640×480 @ 15–25 fps</text><path d="M330 249V269" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/><rect x="180" y="269" width="300" height="74" rx="8" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.5"/><text x="330" y="302" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="normal">MediaPipe Tasks</text><text x="330" y="323" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" fill="#6b6b6b" font-weight="normal">hands + pose (+ face)</text><path d="M330 343V367" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/><rect x="180" y="367" width="300" height="74" rx="8" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.5"/><text x="330" y="400" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="normal">Assemble (543, 3)</text><text x="330" y="421" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" fill="#6b6b6b" font-weight="normal">missing landmarks → NaN, never 0</text><path d="M330 441V465" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/><rect x="180" y="465" width="300" height="74" rx="8" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.5"/><text x="330" y="498" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="normal">Wrist velocity</text><text x="330" y="519" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" fill="#6b6b6b" font-weight="normal">normalised by shoulder width</text><path d="M330 539V560" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/><polygon points="158,616 330,560 502,616 330,672" fill="none" stroke="#8a8a8a" stroke-width="1.5"/><text x="330" y="612" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.5" text-anchor="middle" fill="#1a1a1a" font-weight="normal">Segment complete?</text><text x="330" y="631" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#6b6b6b" font-weight="normal">motion gate FSM</text><path d="M502 616H724" fill="none" stroke="#b4b4b4" stroke-width="1.5" stroke-dasharray="