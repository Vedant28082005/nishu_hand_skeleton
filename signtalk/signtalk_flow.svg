="1.5" stroke-dasharray="5 4"/><text x="516" y="1220" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#6b6b6b" font-weight="normal">yes — suppress</text><path d="M330 1286V1324" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/><text x="340" y="1306" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#6b6b6b" font-weight="normal">no</text><rect x="180" y="1324" width="300" height="56" rx="8" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.5"/><text x="330" y="1357" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="normal">Append gloss to phrase buffer</text><path d="M330 1380V1412" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/><polygon points="158,1468 330,1412 502,1468 330,1524" fill="none" stroke="#8a8a8a" stroke-width="1.5"/><text x="330" y="1464" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.5" text-anchor="middle" fill="#1a1a1a" font-weight="normal">Silence &gt; 1.5 s?</text><text x="330" y="1483" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#6b6b6b" font-weight="normal">utterance boundary</text><path d="M502 1468H724" fill="none" stroke="#b4b4b4" stroke-width="1.5" stroke-dasharray="5 4"/><text x="516" y="1458" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#6b6b6b" font-weight="normal">no — keep buffering</text><path d="M330 1524V1559" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/><text x="340" y="1544" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#6b6b6b" font-weight="normal">yes</text><rect x="180" y="1559" width="300" height="74" rx="8" fill="#e8f0fb" stroke="#2f6fd0" stroke-width="2"/><text x="330" y="1592" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="600">Flush buffer → play WAVs</text><text x="330" y="1613" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" fill="#6b6b6b" font-weight="normal">pre-rendered, no runtime TTS</text><path d="M330 1633V1690H724V212H480" fill="none" stroke="#b4b4b4" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar-q)"/><text x="710" y="1678" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="end" fill="#6b6b6b" font-weight="normal">next frame</text><line x1="48" y1="1708" x2="852" y2="1708" stroke="#e4e4e4"/><rect x="48" y="1720" width="22" height="11" rx="3" fill="#e8f0fb" stroke="#2f6fd0" stroke-width="1.5"/><text x="80" y="1730" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#6b6b6b" font-weight="normal">compute-heavy stage</text><line x1="260" y1="1725" x2="300" y2="1725" stroke="#b4b4b4" stroke-width="1.5" stroke-dasharray="5 4"/><text x="310" y="1730" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#6b6b6b" font-weight="normal">no word emitted — return to capture</text></svg>